# Cognium Conformis subject for the latest-browser-served lane.
#
# One deployed-site subject whose entry points are exactly the 214 lane pages,
# in suite order, served by the corpus server (`node serve.mjs --host 127.0.0.1
# --port 4173`) from a checkout at the pinned corpus revision. It declares no
# flows, so every page is evaluated in its loaded state and flow-anchored
# controls are reported as not run. Paths are corpus-relative and synthetic.
