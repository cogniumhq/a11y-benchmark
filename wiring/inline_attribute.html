<!--
  inline_attribute — broken
  constant defect: a div acting as a button, not keyboard operable
  varied: handler in an inline attribute
  The handler is an HTML attribute, so it is visible to anything that reads the markup. This is the easy case, and the one a hand-written fixture usually reaches for.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>handler in an inline attribute — broken</title>
<link rel="stylesheet" href="../fixture.css">
<style>
.control { display: inline-block; background: #0b4f8a; color: #fff;
  padding: 0.9em 1.6em; border-radius: 4px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
<h1>handler in an inline attribute — broken</h1>
<p>The handler is an HTML attribute, so it is visible to anything that reads the markup. This is the easy case, and the one a hand-written fixture usually reaches for.</p><hr>
<div class="control" id="target" onclick="activate()">Search flights</div>
<p id="state" role="status">Not yet activated.</p>
</main>
<p><a href="../index.html">Back to the index</a></p>
<script>
function activate() { document.getElementById('state').textContent = 'Activated.'; }
</script>
</body>
</html>
