name: Validate corpus

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    # Self-hosted on grace, because GitHub-hosted runners stall: on
    # 2026-10-19 every queued job in the org sat unstarted through a
    # "Degraded availability for GitHub Actions" incident, which blocked
    # seven corpus-fix PRs with nothing wrong with them.
    #
    # The fork guard is not optional. This repository is PUBLIC, and a
    # workflow from a fork would otherwise run arbitrary code on a machine
    # that also hosts the model endpoint, the GPU and fifty runners for other
    # repositories. A fork PR is therefore sent to a GitHub-hosted runner,
    # which can only harm itself. Same-repository pushes and branches, which
    # only a collaborator can create, run on grace.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
          && 'ubuntu-latest' || fromJSON('["self-hosted","grace"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch every public head and tag for the privacy audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: check/package-lock.json
      - name: Install validation dependencies
        run: npm ci --prefix check --ignore-scripts
      - name: Check repository and fixture contracts
        run: node --test check/*.test.mjs

      - name: Validate and score the published result examples
        run: |
          node check/validate-result.mjs schemas/examples/benchmark-result.repeat-1.json
          node check/validate-result.mjs schemas/examples/benchmark-result.repeat-2.json
          node check/validate-result.mjs starter/example-result.repeat-1.json
          node check/validate-result.mjs starter/example-result.repeat-2.json
          node check/score.mjs score \
            schemas/examples/benchmark-result.repeat-1.json \
            schemas/examples/benchmark-result.repeat-2.json \
            --json "$RUNNER_TEMP/score.json" --csv "$RUNNER_TEMP/score.csv"
          # The two repeats differ by one assertion, so compare must exit 1.
          node check/score.mjs compare \
            schemas/examples/benchmark-result.repeat-1.json \
            schemas/examples/benchmark-result.repeat-2.json && exit 1 || test $? -eq 1

      - name: Exercise the publisher starter kit end to end
        run: |
          node starter/run.mjs --out "$RUNNER_TEMP/starter/result.json"
          for result in "$RUNNER_TEMP"/starter/result.repeat-*.json; do
            node check/validate-result.mjs "$result"
          done
          # Corpus identity is read from this checkout, so --strict must pass.
          node check/score.mjs score "$RUNNER_TEMP"/starter/result.repeat-*.json --strict

      - name: Regenerate fixture manifests and pages
        run: |
          for generator in build.mjs delivery.mjs patterns.mjs taxonomy.mjs journeys.mjs scenarios.mjs media.mjs flash.mjs color-independent.mjs ui-states.mjs surfaces.mjs guided.mjs aaa.mjs surface-contracts.mjs native.mjs wiring.mjs manifest.mjs needs-index.mjs coverage.mjs space-coverage.mjs; do
            node "$generator"
          done
      - name: Check generated files are committed
        run: git diff --exit-code -I '"generated":'
