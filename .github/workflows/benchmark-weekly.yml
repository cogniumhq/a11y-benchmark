name: Weekly benchmark

# Runs the pinned multi-tool comparison against the published corpus revision.
# This is the scanner measurement. validate.yml checks the corpus contracts and
# does not run axe, IBM, Alfa, Lighthouse, pa11y, or QualWeb.
#
# Cognium Conformis stays out of this job. Its runtime is private and the
# published lane imports a sanitized export with --cognium-export.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.repository == 'cogniumhq/a11y-benchmark'
    runs-on: [self-hosted, grace]
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The harness lives on the default branch. The corpus pin is an older
      # commit that has no comparison/ tree, so it is checked out beside this
      # checkout. Detaching this checkout would delete the harness before
      # setup-node looks up comparison/package-lock.json.
      - name: Check out the pinned corpus
        run: |
          rev=$(node -e "process.stdout.write(require('./comparison/pins.json').corpus.revision)")
          git worktree add --detach "$RUNNER_TEMP/corpus" "$rev"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: comparison/package-lock.json

      - name: Install the pinned tools
        run: npm ci --prefix comparison

      - name: Install browsers
        run: |
          set -euo pipefail
          npx --prefix comparison playwright install chromium
          # Puppeteer's Chrome download from Google has timed out once on this
          # runner. Retry before giving up; a failed download must not hide
          # the lane comparison below.
          for attempt in 1 2 3; do
            npx --prefix comparison puppeteer browsers install chrome && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done

      - name: Run the published comparison
        run: node comparison/run.mjs --fixture-root "$RUNNER_TEMP/corpus" --out "$RUNNER_TEMP/benchmark"

      # Against the published six-tool bundle. A lost declared criterion or a
      # new false positive fails the job and is filed. A miss that the
      # published bundle already had is written into GAPS.md and does not,
      # by itself, fail the week. Conformis is not in this job.
      - name: Compare with the published lane
        id: gaps
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/benchmark/published-comparison.json"
          curl -fsSL -o "$base" \
            https://raw.githubusercontent.com/cogniumhq/a11y-benchmark-results/main/results/2026-11-02-rerun-v0.1.0-latest-browser-served/comparison.json
          set +e
          node comparison/gaps.mjs "$base" "$RUNNER_TEMP/benchmark/comparison.json" \
            --md "$RUNNER_TEMP/benchmark/GAPS.md" --json "$RUNNER_TEMP/benchmark/gaps.json"
          code=$?
          set -e
          node -e "const r=require(process.argv[1]); process.stdout.write('fail='+(r.fail?'true':'false')+'\n')" \
            "$RUNNER_TEMP/benchmark/gaps.json" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: File the regression
        if: failure() && steps.gaps.outputs.fail == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Weekly benchmark: regression against the published lane"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/benchmark/GAPS.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/benchmark/GAPS.md"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-benchmark
          path: ${{ runner.temp }}/benchmark
          retention-days: 14
