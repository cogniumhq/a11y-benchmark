<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to continue</title>
<link rel="stylesheet" href="../../../fixture.css">
</head>
<body>
<main>
<h1>Sign in to continue</h1>
<p>Sign in with the public benchmark account. The details are published in
<code>access.json</code> and grant nothing outside this corpus.</p>
<form method="post" action="/access/auth/form/login">
<input type="hidden" name="next" value="/access/auth/wall/index.html">
<p><label for="username">Email address or username</label>
<input id="username" name="username" autocomplete="username" required></p>
<p><label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required></p>
<p><button type="submit">Sign in</button></p>
</form>
</main>
</body>
</html>
