<!--
  A training module that redirects on a timer
  WCAG: 3.2.5
  Expectation: a control SHOULD report this
  3.2.5. A short meta refresh sends readers to the next module without an explicit request to change context.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A training module that redirects on a timer</title>
<link rel="stylesheet" href="../fixture.css"><meta http-equiv="refresh" content="12;url=https://example.com/training/orbit-module-two">
</head>
<body>
<main>
<h1>A training module that redirects on a timer</h1>
<p>Module one covers baggage allowances for the fictional Orbit Skies airline.</p>
<p>If you are not redirected, continue to <a href="https://example.com/training/orbit-module-two">module two</a>.</p>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
