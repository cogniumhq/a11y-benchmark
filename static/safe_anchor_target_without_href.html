<!--
  Empty anchor that is a target, not a link
  WCAG: 2.4.4
  Expectation: NO control should report this (negative control)
  Boundary. An <a> with no href is not a link, so it needs no name. It is only a place to jump to.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empty anchor that is a target, not a link</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>Empty anchor that is a target, not a link</h1>
<p><a id="fares"></a><a href="#fares">Back to fares</a></p>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
