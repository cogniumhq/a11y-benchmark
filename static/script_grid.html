<!--
  A script-built calendar with no grid semantics
  WCAG: 1.3.1
  Expectation: a control SHOULD report this
  Clickable day cells are plain divs. Rows and columns are not exposed.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A script-built calendar with no grid semantics</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>A script-built calendar with no grid semantics</h1>
<div id="cal"></div>
<script>
var cal = document.getElementById('cal');
for (var d = 1; d <= 7; d++) {
  var cell = document.createElement('div');
  cell.textContent = String(d);
  cell.onclick = function () {};
  cal.appendChild(cell);
}
</script>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
