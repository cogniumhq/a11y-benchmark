<!--
  role=menu that owns a group of menu items
  WCAG: 1.3.1
  Expectation: NO control should report this (negative control)
  Boundary. A menu may own a named group, and the group owns the items. Reporting this as "no menu items" is wrong.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>role=menu that owns a group of menu items</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>role=menu that owns a group of menu items</h1>
<div role="menu">
<div role="group" aria-label="Account">
<a role="menuitem" href="#trips">My trips</a>
<a role="menuitem" href="#help">Help</a>
</div>
</div>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
