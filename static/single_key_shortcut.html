<!--
  A letter key opens a panel while notes can be typed
  WCAG: 2.1.4
  Expectation: a control SHOULD report this
  2.1.4. A lone printable key toggles a harbour guide with no way to turn shortcuts off or remap them.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A letter key opens a panel while notes can be typed</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>A letter key opens a panel while notes can be typed</h1>
<label for="notes">Voyage notes for crew.example</label>
<textarea id="notes" name="notes" rows="4" placeholder="Record berth assignments and tide windows"></textarea>
<p id="harbor-guide" hidden role="status">Harbour berth legend is visible.</p>
<script>
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'h' && !ev.ctrlKey && !ev.altKey && !ev.metaKey && !ev.shiftKey) {
    ev.preventDefault();
    document.getElementById('harbor-guide').hidden = false;
  }
});
</script>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
