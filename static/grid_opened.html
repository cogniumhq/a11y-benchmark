<!--
  An opened calendar with no grid semantics
  WCAG: 1.3.1, 4.1.2
  Expectation: a control SHOULD report this
  The popover is already open. Day cells are clickable divs, so the open state still has no row or column.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>An opened calendar with no grid semantics</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>An opened calendar with no grid semantics</h1>
<div role="dialog" aria-label="Choose a day">
<div id="cal"></div>
</div>
<script>
var cal = document.getElementById('cal');
for (var d = 1; d <= 7; d++) {
  var cell = document.createElement('div');
  cell.textContent = String(d);
  cell.onclick = function () {};
  cal.appendChild(cell);
}
</script>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
