  Role fallback list whose second token is valid
  WCAG: 4.1.2

-->

</head>

<main>

<div role="unknownwidget button" tabindex="0" onclick="void 0" onkeydown="if(event.key==='Enter'||event.key===' ')event.preventDefault()">Search flights</div>
</main>
